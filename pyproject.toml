[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finpilot-mcp"
version = "0.1.0"
description = "Локальная аналитика банковской выписки: CLI и MCP-сервер для AI-ассистентов"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anton Shkel" }]
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finpilot = "finpilot.cli:main"
finpilot-mcp = "finpilot.server:main"

[tool.setuptools]
packages = ["finpilot"]
